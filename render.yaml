services:
  # ── GraphQL API ────────────────────────────────────────────────────────────
  - type: web
    name: social-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: PORT
        value: "4000"
      - key: NEO4J_URI
        sync: false          # set in Render dashboard (e.g. neo4j+s://xxx.databases.neo4j.io)
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false

  # ── Next.js Web App ────────────────────────────────────────────────────────
  - type: web
    name: social-web
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node apps/web/.next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: JWT_SECRET
        fromService:
          name: social-api
          type: web
          envVarKey: JWT_SECRET
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: social-api
          type: web
          property: hostURL
          transform: "https://{hostURL}/graphql"
