services:
  mongodb:
    image: mongo:7
    container_name: social_media_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: social_media_redis
    ports:
      - '6379:6379'
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:5-community
    container_name: social_media_neo4j
    ports:
      - '7474:7474'   # Neo4j Browser (HTTP)
      - '7687:7687'   # Bolt protocol (driver connections)
    environment:
      # Credentials — mirrors NEO4J_USERNAME / NEO4J_PASSWORD in .env
      NEO4J_AUTH: neo4j/devpassword123!
      # Memory — sensible defaults for a development laptop
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  mongo_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
